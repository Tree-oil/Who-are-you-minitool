<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>谁是你？Who are you?</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23f7f1e2'/%3E%3Cellipse cx='50' cy='42' rx='30' ry='33' fill='none' stroke='%23232323' stroke-width='4'/%3E%3Ccircle cx='38' cy='42' r='4' fill='%23232323'/%3E%3Ccircle cx='62' cy='42' r='4' fill='%23232323'/%3E%3Cpath d='M50 58 Q54 60 56 56' stroke='%23232323' stroke-width='3' fill='none'/%3E%3Cellipse cx='50' cy='82' rx='26' ry='12' fill='%23b8c9a4' stroke='%23232323' stroke-width='4'/%3E%3C/svg%3E">
<style>
  :root {
    --paper: #efe8d8;
    --card: #f8f3e6;
    --ink: #232323;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  html { touch-action: manipulation; }
  body {
    position: relative;
    height: 100vh;
    overflow: hidden;
    background-color: var(--paper);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe Print", "Comic Sans MS", cursive, sans-serif;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }
  #stage {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    display: block;
  }
  h1 {
    position: absolute;
    top: 5.5%;
    left: 0;
    right: 0;
    text-align: center;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe Print", "Comic Sans MS", cursive, sans-serif;
    font-weight: 700;
    font-size: 44px;
    line-height: 1.04;
    letter-spacing: 0;
    color: var(--ink);
    transform: rotate(-2.4deg);
    text-shadow: 1px 2px 0 rgba(35,35,35,.07);
    user-select: none;
    pointer-events: none;
  }
  .inputWrap {
    position: absolute;
    bottom: calc(10% + var(--safe-area-inset-bottom, env(safe-area-inset-bottom, 0px)));
    left: 50%;
    transform: translateX(-50%);
    width: min(370px, 90vw);
    height: 58px;
  }
  .inputWrap input {
    position: relative;
    width: 100%;
    height: 100%;
    border: none;
    outline: none;
    background: transparent;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe Print", "Comic Sans MS", cursive, sans-serif;
    font-style: normal;
    font-size: 24px;
    font-weight: 700;
    letter-spacing: 0;
    color: var(--ink);
    caret-color: #8b3a3a;
    padding: 0 0 0 22px;
    text-align: left;
  }
  .inputWrap input::placeholder { color: rgba(62,56,44,.75); }
  @media (max-width: 420px) {
    h1 { font-size: 36px; }
  }
</style>
</head>
<body>
  <canvas id="stage" aria-label="A hand-drawn creature generated from the username"></canvas>
  <h1>谁是你？</h1>
  <div class="inputWrap">
    <input id="name" placeholder="输入名字..." autocomplete="off" spellcheck="false" aria-label="用户名">
  </div>
<script src="./app.js"></script>
</body>
</html>
